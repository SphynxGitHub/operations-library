name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      # Deploys every folder under supabase/functions (except _shared), so a new function is picked up
      # automatically. A failure in one function is reported by name and does not stop the others; the
      # job still ends red if any failed. All functions check the caller themselves, hence --no-verify-jwt.
      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          failed=0
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            [ -f "$dir/index.ts" ] || continue
            echo "::group::Deploy $name"
            if ! supabase functions deploy "$name" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --no-verify-jwt; then
              echo "::error::Deploying $name failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
