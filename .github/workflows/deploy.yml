name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish only what the pages need. Before, the whole repository folder was published, so
      # anything committed by mistake (a backup file, function source, migrations) was also on the website.
      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='supabase' --exclude='api' --exclude='functions' --exclude='node_modules' \
            --exclude='backup.json' --exclude='.env' --exclude='import-backup.js' \
            --exclude='firebase.json' --exclude='package.json' --exclude='package-lock.json' \
            --exclude='.gitignore' --exclude='*.md' \
            ./ _site/
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
