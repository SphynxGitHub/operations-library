<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Testing checklist</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
  @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } .card { background: #111a2e; border-color: #334155; } .muted { color: #94a3b8; } }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .muted { color: #475569; font-size: 14px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 18px; margin: 16px 0; }
  .card h2 { font-size: 18px; margin: 0 0 2px; }
  ul { list-style: none; padding: 0; margin: 12px 0 0; }
  li { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(148,163,184,0.3); }
  li:first-child { border-top: none; }
  input[type=checkbox] { width: 20px; height: 20px; margin-top: 3px; flex: 0 0 auto; }
  .step-title { font-weight: 600; }
  .step-detail { font-size: 14px; }
  .done .step-title { text-decoration: line-through; opacity: .6; }
  .notice { border-left: 4px solid #38bdf8; }
  .error { border-left: 4px solid #ef4444; }
  a.button { display: inline-block; margin-top: 8px; padding: 8px 14px; border-radius: 8px; background: #2563eb; color: #fff; text-decoration: none; font-size: 15px; }
  @media print { body { background: #fff; color: #000; } .card { border-color: #999; } a.button, #progress { display: none; } }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading your checklist...</p></main>
<script src="checklist.js"></script>
</body>
</html>
