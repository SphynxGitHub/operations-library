<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Testing checklist</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
  @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } .card { background: #111a2e; border-color: #334155; } .muted { color: #94a3b8; } }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .muted { color: #475569; font-size: 14px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 18px; margin: 16px 0; }
  .card h2 { font-size: 18px; margin: 0 0 2px; }
  ul { list-style: none; padding: 0; margin: 12px 0 0; }
  li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(148,163,184,0.3); }
  li:first-child { border-top: none; }
  .step-title { font-weight: 600; }
  .step-detail { font-size: 14px; }
  .done .step-title { opacity: .65; }
  .step-body { flex: 1; min-width: 0; }
  .controls { display: flex; gap: 8px; margin-top: 8px; }
  button.choice { font: inherit; padding: 6px 16px; border-radius: 8px; border: 1px solid #94a3b8; background: transparent; color: inherit; cursor: pointer; }
  button.choice.pass.on { background: #16a34a; border-color: #16a34a; color: #fff; }
  button.choice.fail.on { background: #dc2626; border-color: #dc2626; color: #fff; }
  button.choice:disabled, button.send:disabled { opacity: .5; cursor: default; }
  .note-box { display: none; margin-top: 8px; }
  .note-box label { display: block; font-size: 14px; margin-bottom: 4px; }
  .note-box textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid #94a3b8; background: transparent; color: inherit; }
  button.send { margin-top: 6px; font: inherit; padding: 6px 16px; border-radius: 8px; border: none; background: #2563eb; color: #fff; cursor: pointer; }
  .status { font-size: 14px; margin-top: 6px; min-height: 1em; }
  .status.problem { color: #dc2626; }
  li.failed .step-title { color: #dc2626; }
  .notice { border-left: 4px solid #38bdf8; }
  .error { border-left: 4px solid #ef4444; }
  a.button { display: inline-block; margin-top: 8px; padding: 8px 14px; border-radius: 8px; background: #2563eb; color: #fff; text-decoration: none; font-size: 15px; }
  @media print { body { background: #fff; color: #000; } .card { border-color: #999; } a.button, #progress, .controls, .note-box, .status { display: none; } }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading your checklist...</p></main>
<script src="checklist.js"></script>
</body>
</html>
